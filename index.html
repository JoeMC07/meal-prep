<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f1ec">
<title>Meal Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ec;--tx:#171715;--mut:#74726b;--ln:rgba(23,23,21,.14);--ac:#171715;--mix:34%;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--tx:#f1efe8;--mut:#97958d;--ln:rgba(241,239,232,.16);--ac:#f1efe8;--mix:20%;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121211;--tx:#f1efe8;--mut:#97958d;--ln:rgba(241,239,232,.16);--ac:#f1efe8;--mix:20%;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.5 Inter,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#prog{display:flex;gap:4px;padding:10px 20px 0}
#prog i{flex:1;height:2px;background:var(--ln);border-radius:2px;transition:background .2s}
#prog i.on{background:var(--tx)}
#rec{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#rec::-webkit-scrollbar{display:none}
.s{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;padding-bottom:110px;background:color-mix(in srgb,var(--t) var(--mix),var(--bg));overscroll-behavior:contain}
.hero{padding:26px 0 8px;display:flex;justify-content:center}
.hero img{height:min(42vh,360px);width:auto;border-radius:6px;transform:rotate(-2.5deg);box-shadow:0 24px 40px -18px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.12)}
.body{padding:22px 22px 0}
.eyebrow{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--mut)}
h1{margin:0;font:400 38px/1.05 "Instrument Serif",Georgia,serif;letter-spacing:-.01em}
.stats{display:flex;margin:22px 0 4px;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.stats div{flex:1;padding:12px 0;display:flex;flex-direction:column}
.stats div+div{padding-left:16px;border-left:1px solid var(--ln)}
.stats b{font:600 26px/1.1 Inter,sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--mut);margin-top:2px}
.note{font-size:12.5px;color:var(--mut);margin:10px 0 0}
h2{margin:30px 0 4px;font:400 24px/1.1 "Instrument Serif",Georgia,serif}
.ing{list-style:none;margin:0;padding:0}
.ing li{padding:10px 0;border-bottom:1px solid var(--ln);font-size:15.5px}
.steps{list-style:none;margin:0;padding:0;counter-reset:n}
.steps li{counter-increment:n;display:flex;gap:16px;padding:14px 0;border-bottom:1px solid var(--ln);font-size:15.5px}
.steps li::before{content:counter(n);flex:0 0 22px;font:400 26px/1 "Instrument Serif",Georgia,serif;color:var(--mut)}
#shop{display:none;flex:1;min-height:0;overflow-y:auto;padding:26px 22px 120px}
#shop h1{font-size:40px}
#shop .cnt{color:var(--mut);font-size:13px;margin:6px 0 4px}
#shop h3{margin:28px 0 2px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
#shop label{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--ln);font-size:15.5px}
#shop input{appearance:none;-webkit-appearance:none;flex:0 0 22px;width:22px;height:22px;margin:0;border:1.5px solid var(--mut);border-radius:50%;display:grid;place-content:center}
#shop input::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--tx);transform:scale(0);transition:transform .12s}
#shop input:checked{border-color:var(--tx)}#shop input:checked::after{transform:scale(1)}
#shop input:checked+span{color:var(--mut);text-decoration:line-through}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;padding:12px 22px calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--ln)}
#bar button{flex:1;background:none;border:0;color:var(--mut);font:600 14px Inter,sans-serif;padding:8px 0;border-bottom:2px solid transparent}
#bar button.on{color:var(--tx);border-color:var(--tx)}
</style></head><body>
<div id="prog"></div>
<div id="rec"></div>
<div id="shop"></div>
<div id="bar"><button id="b1" class="on">Recipes</button><button id="b2">Aldi list</button></div>

const T={sp:"#8fbf8a",sg:"#9bc59a",ch:"#c9827b",mc:"#e6967f"};
const $=s=>document.getElementById(s),rec=$("rec"),prog=$("prog"),shop=$("shop");
const pad=n=>String(n).padStart(2,"0");
rec.innerHTML=R.map((r,n)=>`<section class="s" style="--t:${T[r.im]}"><div class="hero"><img src="${IM[r.im]}" alt="${r.n} pack"></div><div class="body"><p class="eyebrow">${pad(n+1)} / ${pad(R.length)} · ${r.t}</p><h1>${r.n}</h1><div class="stats"><div><b>${r.k}</b><span>kcal</span></div><div><b>${r.p}g</b><span>protein</span></div><div><b>4</b><span>portions</span></div></div><p class="note">Macros are the Myprotein pack targets. This version is an estimate.</p><h2>Ingredients</h2><ul class="ing">${r.i.map(x=>`<li>${x}</li>`).join("")}</ul><h2>Method</h2><ol class="steps">${r.s.map(x=>`<li><span>${x}</span></li>`).join("")}</ol></div></section>`).join("");
prog.innerHTML=R.map(()=>"<i></i>").join("");
function upd(){const i=Math.round(rec.scrollLeft/rec.clientWidth);[...prog.children].forEach((e,j)=>e.className=j===i?"on":"")}
rec.onscroll=upd;upd();
let st={};try{st=JSON.parse(localStorage.getItem("ck")||"{}")}catch(e){}
const total=L.reduce((a,g)=>a+g.length-1,0);
shop.innerHTML=`<p class="eyebrow">THIS WEEK</p><h1>Aldi list</h1><div class="cnt" id="cnt"></div>`+L.map(g=>`<h3>${g[0]}</h3>`+g.slice(1).map(x=>`<label><input type="checkbox" data-k="${x}" ${st[x]?"checked":""}><span>${x}</span></label>`).join("")).join("");
function cnt(){$("cnt").textContent=Object.values(st).filter(Boolean).length+" of "+total+" in the trolley"}cnt();
shop.onchange=e=>{st[e.target.dataset.k]=e.target.checked;try{localStorage.setItem("ck",JSON.stringify(st))}catch(x){}cnt()};
function tab(a){$("b1").className=a?"on":"";$("b2").className=a?"":"on";rec.style.display=prog.style.display=a?"":"none";shop.style.display=a?"none":"block"}
$("b1").onclick=()=>tab(1);$("b2").onclick=()=>tab(0);
